<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Playing Card Page</h1>
  </header>

<main id="playing-cards">

  <div class="card">

    <div class="left">A <span>♥</span></div>
    <div class="middle">♥<span>♥</span></div>
    <div class="right">A ♠</div>

  </div>

<div class="card black">

    <div class="left">K ♥♥</div>
    <div class="middle"> ♠<span>♠♠</span></div>
    <div class="right">K ♠</div>
</div>

<div class="card ">
    <div class="left"> J ♣</div>
    <div class="middle"> J ♣ ♣</div>
     <div class="right "> J ♣</div>
</div>


  <div class="card">

    <div class="left"> A ♥ </div>
    <div class="middle">♥♥<span>♠♠</span></div>
    <div class="right">A ♥</div>
  </div>

<div class="card black">

    <div class="left">K ♠</div>
    <div class="middle">♠</div>
    <div class="right">K ♠</div>
</div>

<div class="card ">
    <div class="left"> J ♣</div>
    <div class="middle"> J ♣</div>
     <div class="right "> J ♣</div>
</div>

<div class="card black">

    <div class="left">K ♠</div>
    <div class="middle">♠</div>
    <div class="right">K ♠</div>
</div>


</main>
</body>

</html>
